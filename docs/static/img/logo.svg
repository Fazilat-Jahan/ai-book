<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ai-gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Main circular background -->
  <circle cx="100" cy="100" r="90" fill="url(#ai-gradient)" opacity="0.1"/>

  <!-- AI Brain/Humanoid concept -->
  <g transform="translate(50, 40)">
    <!-- Head -->
    <ellipse cx="50" cy="25" rx="18" ry="20" fill="url(#ai-gradient)" class="logo-element head"/>

    <!-- Eyes -->
    <circle cx="42" cy="20" r="3" fill="#ffffff" class="logo-element eyes"/>
    <circle cx="58" cy="20" r="3" fill="#ffffff" class="logo-element eyes"/>

    <!-- Circuit pattern inside head -->
    <path d="M45 25 Q50 22 55 25 T65 30" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6" class="logo-element"/>
    <path d="M45 28 Q50 25 55 28 T65 33" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.4" class="logo-element"/>

    <!-- Body - stylized humanoid torso -->
    <rect x="40" y="45" width="20" height="30" rx="10" fill="url(#ai-gradient)" class="logo-element body"/>

    <!-- Arms -->
    <rect x="25" y="50" width="15" height="4" rx="2" fill="url(#ai-gradient)" class="logo-element arms"/>
    <rect x="60" y="50" width="15" height="4" rx="2" fill="url(#ai-gradient)" class="logo-element arms"/>

    <!-- Legs -->
    <rect x="42" y="75" width="4" height="15" rx="2" fill="url(#ai-gradient)" class="logo-element legs"/>
    <rect x="54" y="75" width="4" height="15" rx="2" fill="url(#ai-gradient)" class="logo-element legs"/>

    <!-- Tech symbol - atom-like structure -->
    <circle cx="50" cy="60" r="2" fill="#ffffff" class="logo-element brain-dot"/>
    <path d="M50 58 A2 2 0 1 0 50 62 A2 2 0 1 0 50 58" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.4" class="logo-element"/>
    <path d="M48 60 A2 2 0 1 0 52 60 A2 2 0 1 0 48 60" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.4" class="logo-element"/>
  </g>

  <!-- Subtitle/Book indicator -->
  <g transform="translate(65, 140)">
    <rect x="0" y="0" width="70" height="8" rx="2" fill="url(#ai-gradient)" class="logo-element pages"/>
    <rect x="5" y="-5" width="60" height="8" rx="2" fill="url(#ai-gradient)" opacity="0.7" class="logo-element pages"/>
    <rect x="10" y="-10" width="50" height="8" rx="2" fill="url(#ai-gradient)" opacity="0.5" class="logo-element pages"/>
  </g>

  <style>
    .logo-element {
      transition: all 0.3s ease;
    }

    /* Light mode */
    :root {
      --logo-primary: url(#ai-gradient);
      --logo-secondary: #ffffff;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-primary: url(#ai-gradient-dark);
      }
    }

    /* Apply variables */
    .head, .body, .arms, .legs, .pages {
      fill: var(--logo-primary);
    }

    .eyes, .brain-dot {
      fill: var(--logo-secondary);
    }
  </style>
</svg>